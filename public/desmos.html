<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <title>Desmos</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
      #calc { position: absolute; inset: 0; }
      #status {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 15px Rubik, Arial, sans-serif; color: #666; direction: rtl; text-align: center; padding: 12px;
      }
    </style>
  </head>
  <body>
    <div id="status">טוען גרף…</div>
    <div id="calc"></div>
    <script>
      // Runs one Desmos calculator inside an iframe placed on the board. Same bridge as ggb.html:
      //   window.parent.mlGgbBridge.getInitial(key) -> { app, state }   and   onChange(key, stateJson, pngDataUrl)
      (function () {
        // The owner's Desmos API key (https://www.desmos.com/my-api). Another key can be saved
        // in the app ("⚙ Desmos" in the library → localStorage "math-lessons:desmosApiKey").
        var DEFAULT_KEY = "0b9ac6d01a43431dba882aa8bcf37600";
        var apiKey = DEFAULT_KEY;
        try { apiKey = localStorage.getItem("math-lessons:desmosApiKey") || DEFAULT_KEY; } catch (e) {}

        var params = new URLSearchParams(location.search);
        var key = params.get("key");
        // focus=1: this frame is the full-window overlay; Escape goes back to the board
        var focus = params.get("focus") === "1";
        var bridge = window.parent && window.parent !== window ? window.parent.mlGgbBridge : null;
        var init = (bridge && bridge.getInitial(key)) || {};
        var app = init.app || params.get("app") || "graphing";
        var status = document.getElementById("status");

        var SCRIPT_URL = "https://www.desmos.com/api/v1.12/calculator.js?apiKey=" + encodeURIComponent(apiKey);
        // A hosting page's Content-Security-Policy (e.g. a preview that only allows its own
        // scripts) blocks desmos.com silently; this event tells it apart from a network failure.
        var blockedByPolicy = false;
        document.addEventListener("securitypolicyviolation", function (e) {
          if (/desmos\.com/.test(e.blockedURI || "")) blockedByPolicy = true;
        });

        function showError() {
          status.innerHTML = "";
          var p = document.createElement("div");
          if (blockedByPolicy) {
            p.textContent =
              "הדף שבו נפתח הלוח חוסם טעינת סקריפטים מאתרים חיצוניים, ולכן Desmos לא יכול להיטען כאן " +
              "(זה קורה למשל בתצוגה המקדימה של Claude). בהרצה מקומית (start.bat) או באתר ב-Vercel הגרף עובד.";
          } else {
            p.textContent =
              "לא ניתן לטעון את Desmos מ-www.desmos.com. בדוק את החיבור לאינטרנט, ואם יש חוסם פרסומות " +
              "או חומת אש שחוסמים את desmos.com. אם הגדרת מפתח API משלך, ודא שהוא תקין (⚙ Desmos בספרייה).";
          }
          var btn = document.createElement("button");
          btn.textContent = "נסה שוב";
          btn.style.cssText = "margin-top:10px;font:inherit;padding:4px 14px;border:1px solid #bbb;border-radius:6px;background:#f6f7fb;cursor:pointer;";
          btn.onclick = loadScript;
          var wrap = document.createElement("div");
          wrap.appendChild(p);
          wrap.appendChild(btn);
          status.appendChild(wrap);
        }

        function loadScript() {
          status.textContent = "טוען גרף…";
          blockedByPolicy = false;
          var script = document.createElement("script");
          script.src = SCRIPT_URL;
          script.onerror = function () {
            // the CSP event (if any) is dispatched before onerror, but give it a tick to be safe
            setTimeout(showError, 50);
          };
          script.onload = start;
          document.head.appendChild(script);
        }
        loadScript();

        function start() {
          var el = document.getElementById("calc");
          var options = {
            keypad: true,
            settingsMenu: true,
            zoomButtons: true,
            expressionsCollapsed: false,
            border: false,
            autosize: true,
            // thicker lines and bigger text — the board is usually shared over Zoom
            projectorMode: true,
          };
          var calc;
          try {
            calc = app === "3d" ? Desmos.Calculator3D(el, options) : Desmos.GraphingCalculator(el, options);
          } catch (e) {
            status.textContent = "Desmos לא נטען: " + e.message;
            return;
          }
          status.style.display = "none";
          window.calculator = calc;
          if (focus) {
            // the key event stays inside the iframe, so hand Escape to the board ourselves
            document.addEventListener("keydown", function (e) {
              if (e.key === "Escape" && bridge && typeof bridge.closeFocus === "function") {
                e.preventDefault();
                bridge.closeFocus();
              }
            }, true);
          }
          if (init.state) {
            try { calc.setState(JSON.parse(init.state)); } catch (e) {}
          }

          var timer = null;
          function save() {
            if (!bridge) return;
            var state = JSON.stringify(calc.getState());
            function send(png) { bridge.onChange(key, state, png || null); }
            // the 3D calculator throws on asyncScreenshot ("unimplemented in 3D"), so fall back to screenshot()
            try {
              calc.asyncScreenshot({ targetPixelRatio: 1.5 }, send);
              return;
            } catch (e) {}
            try {
              send(calc.screenshot({ targetPixelRatio: 1.5 }));
            } catch (e) {
              send(null);
            }
          }
          function scheduleSave() {
            clearTimeout(timer);
            timer = setTimeout(save, 700);
          }
          if (typeof calc.observeEvent === "function") calc.observeEvent("change", scheduleSave);
          // fresh snapshot on every load, so thumbnails and PDF export always match the graph
          scheduleSave();
        }
      })();
    </script>
  </body>
</html>
