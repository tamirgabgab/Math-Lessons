<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <title>GeoGebra</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
      #ggb { width: 100%; height: 100%; }
      #status {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 15px Rubik, Arial, sans-serif; color: #666; direction: rtl; text-align: center; padding: 12px;
      }
    </style>
  </head>
  <body>
    <div id="status">טוען גרף…</div>
    <div id="ggb"></div>
    <script>
      // Runs one GeoGebra applet inside an iframe placed on the board.
      // Talks to the board (same origin) through window.parent.mlGgbBridge:
      //   getInitial(key) -> { app, base64 }   and   onChange(key, base64, pngDataUrl)
      (function () {
        var params = new URLSearchParams(location.search);
        var key = params.get("key");
        var bridge = window.parent && window.parent !== window ? window.parent.mlGgbBridge : null;
        var init = (bridge && bridge.getInitial(key)) || {};
        var appName = init.app || params.get("app") || "graphing";
        var status = document.getElementById("status");

        var script = document.createElement("script");
        script.src = "https://www.geogebra.org/apps/deployggb.js";
        script.onerror = function () {
          status.textContent = "לא ניתן לטעון את GeoGebra — בדוק את החיבור לאינטרנט.";
        };
        script.onload = start;
        document.head.appendChild(script);

        function start() {
          var timer = null;
          var api = null;

          function save() {
            if (!api || !bridge) return;
            api.getBase64(function (b64) {
              var png = null;
              try { png = "data:image/png;base64," + api.getPNGBase64(1.5, false, 72); } catch (e) {}
              bridge.onChange(key, b64, png);
            });
          }
          function scheduleSave() {
            clearTimeout(timer);
            timer = setTimeout(save, 700);
          }

          var p = {
            appName: appName,
            width: window.innerWidth,
            height: window.innerHeight,
            showToolBar: true,
            showAlgebraInput: true,
            showMenuBar: false,
            showResetIcon: false,
            enableRightClick: true,
            enableShiftDragZoom: true,
            showZoomButtons: true,
            showFullscreenButton: false,
            showKeyboardOnFocus: "false",
            language: "iw",
            borderColor: "#ffffff",
            appletOnLoad: function (ggbApi) {
              api = ggbApi;
              status.style.display = "none";
              api.registerAddListener(scheduleSave);
              api.registerRemoveListener(scheduleSave);
              api.registerUpdateListener(scheduleSave);
              api.registerRenameListener(scheduleSave);
              api.registerClientListener(function (evt) {
                var t = evt && (evt.type || evt[0]);
                if (t === "viewChanged2D" || t === "viewChanged3D" || t === "deselect") scheduleSave();
              });
              window.addEventListener("resize", function () {
                api.setSize(window.innerWidth, window.innerHeight);
              });
              // fresh snapshot on every load, so thumbnails and PDF export always match the graph
              scheduleSave();
            },
          };
          if (init.base64) p.ggbBase64 = init.base64;
          new window.GGBApplet(p, true).inject("ggb");
        }
      })();
    </script>
  </body>
</html>
